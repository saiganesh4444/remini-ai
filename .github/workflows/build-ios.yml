name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile Remini AI for iPhone
        run: |
          set -e
          echo "Finding Swift files..."
          SWIFT_FILES=$(find ReminiAI -name "*.swift" -not -path "*/build/*")
          echo "Compiling Swift files: $SWIFT_FILES"
          
          xcrun -sdk iphoneos swiftc \
            -target arm64-apple-ios16.0 \
            -O \
            -framework SwiftUI \
            -framework UIKit \
            -framework CoreImage \
            -framework Vision \
            -framework Photos \
            -framework PhotosUI \
            -o ReminiAI_bin \
            $SWIFT_FILES

          echo "Packaging into IPA..."
          mkdir -p Payload/ReminiAI.app
          cp ReminiAI_bin Payload/ReminiAI.app/ReminiAI
          INFO_PLIST=$(find ReminiAI -name "Info.plist" | head -n 1)
          cp "$INFO_PLIST" Payload/ReminiAI.app/Info.plist
          
          zip -r ReminiAI.ipa Payload
          echo "IPA packaging complete!"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReminiAI-iPhone13-IPA
          path: ReminiAI.ipa
