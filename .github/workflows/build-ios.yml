name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile Remini AI for iPhone 13
        run: |
          set -e
          echo "Scanning Swift source files in ReminiAI/ReminiAI..."
          SWIFT_FILES=$(find ReminiAI/ReminiAI -name "*.swift" -not -name "Package.swift" -not -path "*/build/*")
          echo "Files to compile:"
          echo "$SWIFT_FILES"
          
          xcrun -sdk iphoneos swiftc \
            -target arm64-apple-ios16.0 \
            -O \
            -framework SwiftUI \
            -framework UIKit \
            -framework CoreImage \
            -framework Vision \
            -framework Photos \
            -framework PhotosUI \
            -framework Security \
            -o ReminiAI_bin \
            $SWIFT_FILES

          echo "Packaging Payload to ReminiAI.ipa..."
          mkdir -p Payload/ReminiAI.app
          cp ReminiAI_bin Payload/ReminiAI.app/ReminiAI
          INFO_PLIST=$(find ReminiAI -name "Info.plist" | head -n 1)
          cp "$INFO_PLIST" Payload/ReminiAI.app/Info.plist
          
          # Ensure bundle ID is strictly com.saiganesh.reminiai without unexpanded Xcode variables
          sed -i '' 's/\$(PRODUCT_BUNDLE_IDENTIFIER)/com.saiganesh.reminiai/g' Payload/ReminiAI.app/Info.plist || true
          
          zip -r ReminiAI.ipa Payload
          echo "Unsigned IPA packaged successfully!"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReminiAI-iPhone13-IPA
          path: ReminiAI.ipa

      - name: Upload Web Editor Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReminiAI-Web-Editor
          path: web/
