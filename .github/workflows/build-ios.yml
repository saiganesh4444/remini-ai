name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobachevsky/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Build App for iOS Device
        run: |
          cd ReminiAI
          xcodebuild build \
            -project ReminiAI.xcodeproj \
            -scheme ReminiAI \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Payload to .IPA
        run: |
          cd ReminiAI
          mkdir -p build/Payload
          cp -r build/Build/Products/Release-iphoneos/ReminiAI.app build/Payload/
          cd build
          zip -r ReminiAI.ipa Payload
          cd ../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReminiAI-iPhone13-IPA
          path: ReminiAI/build/ReminiAI.ipa
